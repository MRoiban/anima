<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Anima list editing</title>
  <script type="module" src="../../../packages/web/dist/anima-icon.js"></script>
  <script type="module" src="../../../packages/web/dist/anima-data.js"></script>
  <script type="module" src="../../../packages/web/dist/anima-host.js"></script>
  <script type="module" src="../../../packages/web/dist/anima-host-edit.js"></script>
  <anima-icon auto-bind src="board.ani" style="font-size: 120px"></anima-icon>
  <button id="add">Add track</button>
  <button id="remove">Remove last</button>
  <button id="swap">Swap first and last</button>
  <output></output>
  <script type="module">
    const icon = document.querySelector('anima-icon');
    const prepare = () => {
      const tracks = icon.data.list('$tracks');
      const show = () => {
        document.querySelector('output').value = tracks.value.map((v) => v.title).join(', ');
      };
      tracks.on('change', show);
      show();
      document.querySelector('#add').onclick = () => tracks.add({ title: 'Next' });
      document.querySelector('#remove').onclick = () => {
        if (tracks.length) tracks.remove(tracks.length - 1);
      };
      document.querySelector('#swap').onclick = () => {
        if (tracks.length > 1) tracks.swap(0, tracks.length - 1);
      };
    };
    icon.addEventListener('anima:load', prepare);
    if (icon.player) prepare();
  </script>
</html>
