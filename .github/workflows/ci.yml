name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Headless Chromium and Firefox for the <anima-icon> browser tests (packages/web/test).
      - run: npx playwright-core install --with-deps --only-shell chromium firefox
      - run: |
          echo "CHROMIUM_PATH=$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | head -1)" >> "$GITHUB_ENV"
          echo "FIREFOX_PATH=$(ls -d ~/.cache/ms-playwright/firefox-*/firefox/firefox | head -1)" >> "$GITHUB_ENV"
      - name: Complete check (tests, both browsers, oracle, size, artifacts, perf)
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Size and performance summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Size and performance'
            echo '```text'
            if [ -f check.log ]; then
              grep -E ' B min\+gzip|^compile:|^frame:' check.log || echo 'No measurements reached; inspect the check step.'
            else
              echo 'Check did not start; inspect preceding steps.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
